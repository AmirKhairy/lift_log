name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-latest

    steps:
      # 1. Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 3. Install dependencies
      - name: Install Dependencies
        run: flutter pub get

      # 4. Build unsigned iOS application
      - name: Build iOS Application
        run: |
          flutter build ios --release --no-codesign || true

          echo "Checking for generated Runner.app..."

          if [ -d "build/ios/Release-iphoneos/Runner.app" ]; then
            echo "Runner.app found successfully."
          else
            echo "Runner.app was not generated."
            echo "Searching for generated .app files..."
            find build/ios -name "*.app" -print
            exit 1
          fi

      # 5. Package Runner.app into IPA
      - name: Package IPA
        run: |
          rm -rf Payload Runner.ipa

          mkdir -p Payload

          cp -R build/ios/Release-iphoneos/Runner.app Payload/Runner.app

          zip -r Runner.ipa Payload

          echo "IPA created successfully."

          echo "IPA contents:"
          unzip -l Runner.ipa | head -40

      # 6. Upload IPA
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Runner-ipa
          path: Runner.ipa
          retention-days: 7